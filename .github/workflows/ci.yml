name: CI

# Windows rather than Linux, which would be cheaper: the product is a Windows
# application, and part of the tests go through PowerShell 5.1 and the C
# runtime to check how arguments reach a native executable. On another system
# those tests skip themselves, and the most serious defect found so far would
# go unnoticed.

on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

# A push arriving while CI runs makes the previous run useless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` respects the lockfile. The install scripts are needed: without
      # them the Electron binary is not downloaded, and the build fails at a point
      # that has nothing to do with the cause.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The build is part of the check: a packaging error shows neither in the
      # typecheck nor in the tests.
      - name: Build
        run: npm run build
