appId: dev.nixo.claudemanager
productName: ClaudeManager
copyright: MIT

directories:
  output: release
  buildResources: build

# Solo l'output compilato e i moduli nativi. Il resto (sorgenti, config di
# build, cache) non serve a runtime e gonfierebbe il pacchetto.
files:
  - out/**/*
  - package.json

# @lydell/node-pty distribuisce il binario in un pacchetto per piattaforma:
# senza questo, electron-builder includerebbe anche quelli di macOS e Linux.
asarUnpack:
  - node_modules/@lydell/node-pty/**
  - node_modules/@lydell/node-pty-win32-x64/**

# Nessun certificato configurato: gli eseguibili non sono firmati e al primo
# avvio Windows mostrerà l'avviso SmartScreen. È atteso per una build locale.
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ClaudeManager
  artifactName: ${productName}-Setup-${version}.${ext}
  uninstallDisplayName: ${productName}

portable:
  artifactName: ${productName}-${version}-portable.${ext}

# Le release vanno su GitHub. electron-updater legge lo stesso blocco a runtime
# per sapere dove cercare gli aggiornamenti, quindi va tenuto qui e non solo
# nel comando di pubblicazione.
publish:
  provider: github
  owner: Tha-Nixo
  repo: ClaudeCodeManager
  # Le bozze non sono visibili all'updater: la release va pubblicata per essere
  # vista. La si crea come bozza e la si pubblica quando e' pronta.
  releaseType: draft

extraMetadata:
  main: out/main/index.js
