appId: dev.nixo.claudemanager
productName: ClaudeManager
copyright: MIT

directories:
  # One folder per version: prevents mixing artifacts from different releases,
  # ensuring a clear upload list for GitHub releases.
  output: release/v${version}
  buildResources: build

# Only compiled output and native modules. Sources and build caches are omitted.
files:
  - out/**/*
  - package.json

# @lydell/node-pty distributes platform-specific binaries:
# unpack only Windows x64 binaries.
asarUnpack:
  - node_modules/@lydell/node-pty/**
  - node_modules/@lydell/node-pty-win32-x64/**

# No code-signing certificate configured: executables are unsigned.
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ClaudeManager
  artifactName: ${productName}-Setup-${version}.${ext}
  uninstallDisplayName: ${productName}

portable:
  artifactName: ${productName}-${version}-portable.${ext}

# Releases hosted on GitHub. electron-updater reads this block at runtime
# to check for updates.
publish:
  provider: github
  owner: Tha-Nixo
  repo: ClaudeCodeManager
  # Drafts are not visible to updater: published only when explicitly released.
  releaseType: draft

extraMetadata:
  main: out/main/index.js
